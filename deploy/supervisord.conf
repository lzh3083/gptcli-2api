[supervisord]
nodaemon=true
user=root
logfile=/app/turnstile-solver/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:turnstile-solver]
directory=/app/turnstile-solver
command=python api_solver.py --browser_type %(ENV_TURNSTILE_BROWSER_TYPE)s --thread %(ENV_TURNSTILE_THREAD)s --host %(ENV_TURNSTILE_HOST)s --port %(ENV_TURNSTILE_PORT)s --proxy
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/app/turnstile-solver/logs/turnstile_solver.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/app/turnstile-solver/logs/turnstile_solver.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
priority=10

[program:registration-sidecar]
directory=/app
command=python3 -B scripts/registration_service.py
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/app/turnstile-solver/logs/registration_sidecar.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/app/turnstile-solver/logs/registration_sidecar.log
stderr_logfile_maxbytes=20MB
stderr_logfile_backups=3
priority=20

[program:gptcli-2api]
directory=/app
command=/app/bin/grok2api
autostart=true
autorestart=true
startretries=10
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
