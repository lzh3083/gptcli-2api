services:
  # Redis / Postgres are internal-only (no host port publish).
  # App reaches them via the compose network: redis:6379 / postgres:5432.
  redis:
    image: redis:7-alpine
    container_name: gptcli-2api-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: gptcli-2api-postgres
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      PGTZ: "${TZ:-Asia/Shanghai}"
      POSTGRES_USER: grok2api
      POSTGRES_PASSWORD: grok2api  # ⚠️ CHANGE in production — do not use default
      POSTGRES_DB: grok2api
    volumes:
      - gpt2api_pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grok2api -d grok2api"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single app container: API + inline Turnstile Solver (same process tree)
  gptcli-2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gptcli-2api:local
    container_name: gptcli-2api
    env_file:
      - .env
    ports:
      # Only the app API is published. Postgres/Redis stay internal-only
      # (compose network). Inline Turnstile Solver listens on container
      # loopback 127.0.0.1:5073 and is NOT published to the host.
      - "0.0.0.0:8081:8081"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined # Camoufox/Chromium 沙箱需要；浏览器若改 sandbox 模式可移除
      - no-new-privileges:true # 阻止容器内提权（setuid 等），缩小逃逸面
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # ── 纯注册机模式（register-only）──────────────────────
      # 本项目专注于 ChatGPT 自动化协议注册与 Codex OAuth CPA 凭证导出。
      # register-only 会彻底关闭所有未使用的公共 LLM API 路由、探活协程与用量扫描。
      GPTCLI_MODE: "${GPTCLI_MODE:-register-only}"
      GROK2API_MODE: "${GROK2API_MODE:-register-only}"
      GROK2API_HOST: "0.0.0.0"
      GROK2API_PORT: "8081"
      GROK2API_OPEN_BROWSER: "0"
      GROK2API_TOKEN_MAINTAIN: "0"
      GROK2API_MODEL_HEALTH: "0"
      GROK2API_REASONING_COMPAT: "off"
      GROK2API_STORE_BACKEND: "hybrid"
      GROK2API_REG_ENGINE: "openai"
      GROK2API_MODEL_HEALTH_INTERVAL: "0"
      GROK2API_MODEL_HEALTH_AUTO_DISABLE: "0"
      GROK2API_MAINTAINER_LEADER: "0"
      ENABLE_CODEX_AUTO: "${ENABLE_CODEX_AUTO:-True}"
      FORCE_PHONE_VERIFICATION: "${FORCE_PHONE_VERIFICATION:-True}"
      SMS_COUNTRY: "${SMS_COUNTRY:-4,16,73,6,117}"
      SMS_CODE_WAIT: "${SMS_CODE_WAIT:-120}"
      SMS_MAX_RETRIES: "${SMS_MAX_RETRIES:-10}"
      SMS_PROVIDER: "${SMS_PROVIDER:-smsbower}"
      # Multi-worker: default 2 (enough for hybrid; override via .env for large hosts)
      GROK2API_WORKERS: "${GROK2API_WORKERS:-2}"
      # In-stack service DNS (do not use 127.0.0.1 here)
      REDIS_URL: "redis://redis:6379/0"
      GROK2API_REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgresql://grok2api:grok2api@postgres:5432/grok2api"
      GROK2API_DATABASE_URL: "postgresql://grok2api:grok2api@postgres:5432/grok2api"
      # Inline local Turnstile Solver (same container, Python captcha)
      GROK2API_CAPTCHA_PROVIDER: "${GROK2API_CAPTCHA_PROVIDER:-local}"
      CAPTCHA_PROVIDER: "${CAPTCHA_PROVIDER:-local}"
      GROK2API_LOCAL_SOLVER_URL: "${GROK2API_LOCAL_SOLVER_URL:-http://127.0.0.1:5073}"
      LOCAL_SOLVER_URL: "${LOCAL_SOLVER_URL:-http://127.0.0.1:5073}"
      GROK2API_INLINE_SOLVER: "${GROK2API_INLINE_SOLVER:-1}"
      TURNSTILE_HOST: "127.0.0.1"
      TURNSTILE_PORT: "5073"
      # Align with registration concurrency (default 1 for browser engine)
      GROK2API_REG_CONCURRENCY: "${GROK2API_REG_CONCURRENCY:-1}"
      TURNSTILE_THREAD: "${TURNSTILE_THREAD:-${GROK2API_REG_CONCURRENCY:-3}}"
      TURNSTILE_BROWSER_TYPE: "${TURNSTILE_BROWSER_TYPE:-camoufox}"
      # Idle memory: warm browsers only when solving captcha; reclaim after quiet period
      TURNSTILE_LAZY: "${TURNSTILE_LAZY:-1}"
      TURNSTILE_IDLE_SEC: "${TURNSTILE_IDLE_SEC:-180}"
      # Go is the main process; Python only runs registration/SSO/captcha sidecars.
      GROK2API_RUNTIME: "${GROK2API_RUNTIME:-go}"
      GROK2API_GO_PUBLIC_READ: "${GROK2API_GO_PUBLIC_READ:-1}"
      GROK2API_GO_CHAT: "${GROK2API_GO_CHAT:-1}"
      GROK2API_GO_MESSAGES: "${GROK2API_GO_MESSAGES:-1}"
      GROK2API_GO_RESPONSES: "${GROK2API_GO_RESPONSES:-1}"
      GROK2API_GO_ADMIN_READ: "${GROK2API_GO_ADMIN_READ:-1}"
      GROK2API_GO_ADMIN_WRITE: "${GROK2API_GO_ADMIN_WRITE:-1}"
      GROK2API_GO_MAINTAINER: "${GROK2API_GO_MAINTAINER:-0}"
      GROK2API_GO_WRITES: "${GROK2API_GO_WRITES:-1}"
      GROK2API_GO_OWNERSHIP_MODE: "${GROK2API_GO_OWNERSHIP_MODE:-all}"
      # Python registration + SSO sidecar (used when GROK2API_RUNTIME=go)
      GROK2API_REGISTRATION_SIDECAR: "${GROK2API_REGISTRATION_SIDECAR:-1}"
      GROK2API_REGISTRATION_HOST: "127.0.0.1"
      GROK2API_REGISTRATION_PORT: "18080"
      GROK2API_REGISTRATION_SERVICE_URL: "${GROK2API_REGISTRATION_SERVICE_URL:-http://127.0.0.1:18080}"
      GROK2API_REGISTRATION_TOKEN: "${GROK2API_REGISTRATION_TOKEN:-}"
      PYTHONPATH: "/app:/app/grok-build-auth:/app/grok-build-auth/openai_client"
      # In-container hot-update (docker.sock + /compose mount; no host watcher)
      # 安全：默认禁用。启用需同时满足 ①HOT_UPDATE_ENABLED=1 ②挂载 docker.sock。
      GROK2API_HOT_UPDATE_ENABLED: "${GROK2API_HOT_UPDATE_ENABLED:-0}"
      GROK2API_HOT_UPDATE_MODE: "${GROK2API_HOT_UPDATE_MODE:-docker}"
      GROK2API_COMPOSE_DIR: "${GROK2API_COMPOSE_DIR:-/compose}"
      GROK2API_DOCKER_SERVICE: "${GROK2API_DOCKER_SERVICE:-gptcli-2api}"
      GROK2API_GHCR_IMAGE: "${GROK2API_GHCR_IMAGE:-ghcr.io/lzh3083/gptcli-2api}"
    healthcheck:
      # $$ keeps substitution inside the container so override ports work
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${GROK2API_PORT:-8081}/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    volumes:
      - ./grok2api:/app/grok2api
      - ./grok-build-auth:/app/grok-build-auth
      - ./scripts:/app/scripts
      - ./static:/app/static
      - ./data:/app/data
      - ./turnstile-solver/logs:/app/turnstile-solver/logs
      # ── 容器内热更新（默认关闭，安全 opt-in）────────────────────────
      # 挂载 docker.sock 等于把宿主机 root 控制权交给容器；admin 会话一旦
      # 失陷即可被完整逃逸。确需"管理台一键热更新"时，取消下面两行注释，
      # 并同时设置 GROK2API_HOT_UPDATE_ENABLED=1（见上方 environment）。
      # - /var/run/docker.sock:/var/run/docker.sock
      # Compose project for force-recreate (override file written under /compose).
      # - ./:/compose
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Explicit aliases so external stacks (sub2api etc.) can resolve us after recreate
    networks:
      default:
        aliases:
          - gptcli-2api
    restart: unless-stopped

volumes:
  gpt2api_pg:

# Fixed project network name so other compose stacks can join as external:
networks:
  default:
    name: gptcli-2api_default
    driver: bridge
    labels:
      com.gptcli-2api.network: "shared-upstream"
